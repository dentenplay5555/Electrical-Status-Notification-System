name = "appliance-notifier-backend"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# ----- KV: ถูก replace ด้วย D1 latest_status table แล้ว -----
# ลบ block นี้ได้เมื่อยืนยันว่า D1 /status ทำงานถูกต้องบน production (ลบ '#' ออกได้เลย)
# [[kv_namespaces]]
# binding = "LATEST_STATUS"
# id = "8e81e9f0782a48748f11da8b3edbbbcb"

# ----- D1: เก็บ log ประวัติ + latest_status แทน KV -----
[[d1_databases]]
binding = "DB"
database_name = "appliance-db"
database_id = "80d5d3eb-8c1f-4812-b67c-00643673a594"

# ----- Cron: รันทุกวัน 09:10 UTC = 16:10 น. เวลาไทย -----
[triggers]
crons = ["10 9 * * *"]
